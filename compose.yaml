# AIOMetadata — simple self-hosted deployment
# 1. Copy .env.setup.example to .env and set HOST_NAME.
# 2. Run: docker compose up -d
services:
  aiometadata:
    build: .
    image: aiometadata-local:latest
    container_name: aiometadata
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${PORT:-3232}:3232"
    volumes:
      - ./data:/app/addon/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3232/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:8-alpine
    container_name: aiometadata-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 3600 1
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
